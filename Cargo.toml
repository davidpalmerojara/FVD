[package]
name = "tesela"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
ssimulacra2 = { version = "0.5.1", optional = true }
rayon = { version = "1", optional = true }

[features]
default = ["cli"]
parallel = ["dep:rayon"]
metrics = ["dep:ssimulacra2"]
cli = ["dep:image", "metrics", "parallel"]

[profile.release]
debug = false
codegen-units = 1
lto = "thin"

[[bin]]
name = "tesela"
path = "src/main.rs"
required-features = ["cli"]

[lib]
crate-type = ["rlib", "cdylib"]

# Para el fuzzer: optimizado, pero con comprobación de desbordamientos.
[profile.fuzz]
inherits = "release"
overflow-checks = true
debug-assertions = true
