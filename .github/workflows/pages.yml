# Publica web/ (portada, comparador y demo) en GitHub Pages.
# La web se sirve desde Cloudflare Pages (tesela.davidpalmero.dev), así que este
# flujo solo se lanza a mano. Para usarlo: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1-threads
      - name: Compilar el módulo WebAssembly
        run: web/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
