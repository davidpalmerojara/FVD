name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1-threads
      - name: Tests
        run: cargo test --release
      - name: Fuzzing breve del decodificador (archivos mutados; no puede caerse)
        run: cargo run --profile fuzz --example fuzz_decode -- 20000 ${{ github.run_number }}
      - name: Compilar WebAssembly
        run: cargo build --release --target wasm32-unknown-unknown --lib --no-default-features --features metrics
      - name: Determinismo nativo vs WebAssembly
        run: |
          cp target/wasm32-unknown-unknown/release/tesela.wasm web/tesela.wasm
          ./target/release/tesela encode web/compare/sample.png /tmp/s.tsl -q 80 --tile 256
          ./target/release/tesela decode /tmp/s.tsl /tmp/s.rgb
          node web/test-wasm.mjs /tmp/s.tsl /tmp/s.rgb
      - name: Vectores de conformidad v1 en WebAssembly
        run: node web/test-vectors.mjs
      - name: WebAssembly con hilos igual que nativo
        run: |
          cargo build --release --target wasm32-wasip1-threads --lib --no-default-features --features metrics
          cp target/wasm32-wasip1-threads/release/tesela.wasm web/tesela-mt.wasm
          ./target/release/tesela encode web/compare/sample.png /tmp/l.tsl --lossless
          ./target/release/tesela decode /tmp/l.tsl /tmp/l.rgb
          ./target/release/tesela encode web/compare/sample.png /tmp/n.tsl -q 80
          TH=1,2,4 node web/test-wasm-mt.mjs /tmp/l.rgb 768 512 /tmp/n.tsl
