# Compilación de WebAssembly con hilos (web/tesela-mt.wasm): memoria
# compartida de hasta 2 GB para poder codificar fotos grandes. Se exporta el
# inicializador del hilo principal de wasi-libc, que la página llama una vez
# (el módulo es una biblioteca y no tiene `_start`).
[target.wasm32-wasip1-threads]
rustflags = ["-C", "link-arg=--max-memory=2147483648", "-C", "link-arg=--export=__wasi_init_tp", "-C", "link-arg=--export=__wasm_call_ctors", "-C", "link-arg=--export=__wasm_init_tls", "-C", "link-arg=--export=__tls_base", "-C", "link-arg=--export=__tls_size", "-C", "link-arg=--export=__tls_align"]
